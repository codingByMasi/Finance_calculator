name: Update exchange-rate snapshot

# Fetches reference rates once a day and commits them. The site redeploys on every commit, so visitors see the new date.
# The script refuses data that fails its checks, in which case the job fails and the old snapshot (with its date) stays.
on:
  schedule:
    - cron: '17 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-fx.mjs
      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain src/data/fx-rates.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/fx-rates.json
            git commit -m "Update exchange-rate snapshot"
            git push
          fi
