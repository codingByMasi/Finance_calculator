name: Check official tax data sources

# Weekly check of the official pages listed in src/config/data-sources.json.
# It NEVER changes tax figures. If a page changed or a known figure vanished, it opens (or updates)
# a GitHub issue so a human can review the source and edit the config files.
on:
  schedule:
    - cron: '17 3 * * 1'   # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write   # to commit the last-checked status file
  issues: write     # to open the review issue

concurrency:
  group: check-sources
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check sources
        run: node scripts/check-sources.mjs --seed-missing --write-status --report source-report.md --attention-file attention.md
      - name: Commit status (last-checked dates only)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/source-status.json data/source-baseline.json
          if git diff --cached --quiet; then echo "No status change"; else git commit -m "chore: update source check status" && git push; fi
      - name: Open or update review issue
        if: hashFiles('attention.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create data-review --color D93F0B --description "Official tax source changed; needs human review" 2>/dev/null || true
          existing=$(gh issue list --label data-review --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file attention.md
          else
            gh issue create --title "Tax data sources need review" --label data-review --body-file attention.md
          fi
